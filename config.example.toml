[runtime]
data_dir = "/var/lib/y2b"
database = "/var/lib/y2b/state.db"
download_dir = "/var/lib/y2b/downloads"
backup_dir = "/var/lib/y2b/backups"
timezone = "Asia/Shanghai"

[monitor]
poll_seconds = 60
reconcile_hours = 6
reconcile_limit = 30
max_attempts = 5

[youtube]
yt_dlp = "/usr/local/bin/yt-dlp"
cookies = "/var/lib/y2b/youtube_cookies.txt"
probe_url = "https://www.youtube.com/watch?v=jNQXAC9IVRw"
max_pixels = 2073600
max_fps = 60.0
# 超过该时长的视频直接跳过，不入队（主要针对 1–4 小时的直播回放）。0 = 不限制。
max_duration_seconds = 7200

[bilibili]
biliup = "/usr/local/bin/biliup"
cookies = "/var/lib/y2b/bilibili_cookies.json"
# 新投稿之间至少间隔 30 分钟；B站返回 21566 后全局冷却 6 小时。
submit_interval_seconds = 1800
rate_limit_cooldown_seconds = 21600

[ai]
pi = "/usr/local/bin/pi"
extension = "/opt/y2b/pi/y2b-extension.ts"
policy = "/opt/y2b/pi/policy.json"
provider = "deepseek"
model = "deepseek-v4-flash"
# 投稿元数据、分句和翻译统一关闭 thinking，避免成本和流式输出量失控。
thinking = "off"
timeout_seconds = 300
# adaptive: 分句按 token 自适应；翻译同时按 token 和条数上限拆批。
# whole_video: 只允许整条视频一次处理，超过安全阈值则停止并提示切换模式。
batch_mode = "adaptive"
context_window_tokens = 256000
safe_context_tokens = 200000
segment_overlap_cues = 12
# 单次分句调用的最大 cue 数，防止超大调用超时/失败重来代价大。
segment_max_cues = 400
translation_batch_cues = 50
# Pi 翻译批次并发。2 GiB 服务器实测 3 路仅约 320–380 MiB，默认提高到 4；继续受 systemd 内存上限保护。
translation_concurrency = 4
# 单批输出不是有效 JSON、索引校验失败或 Pi 调用失败时的额外重试次数。
translation_batch_retries = 2
# daily_token_limit = 1000000

[render]
ffmpeg = "/usr/local/bin/ffmpeg"
ffprobe = "/usr/local/bin/ffprobe"

[storage]
warn_free_gib = 10
stop_free_gib = 5
delete_large_after_upload = true
daily_backups = 7
weekly_backups = 4

[translation]
source_lang = "en"
target_lang = "zh-CN"
