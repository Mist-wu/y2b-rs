[runtime]
data_dir = "/var/lib/y2b"
database = "/var/lib/y2b/state.db"
download_dir = "/var/lib/y2b/downloads"
backup_dir = "/var/lib/y2b/backups"
timezone = "Asia/Shanghai"

[monitor]
poll_seconds = 60
# playlistItems.list 按调用计费，默认一次取满 50 条。
data_api_max_results = 50
# 历史不少于 5 条时：按 runtime.timezone 聚合星期 + 小时，热窗 2 小时内每 60 秒轮询，窗外每 30 分钟。
prediction_window_minutes = 120
prediction_hot_poll_seconds = 60
prediction_cold_poll_minutes = 30
# 新频道历史不足时固定每 5 分钟轮询。
prediction_fallback_poll_minutes = 5
prediction_min_samples = 5
# 每 6 小时做一次 API 深扫；只有 API 深扫失败才用 yt-dlp 校对兜底。
reconcile_hours = 6
reconcile_limit = 30
max_attempts = 5

[youtube]
yt_dlp = "/usr/local/bin/yt-dlp"
cookies = "/var/lib/y2b/youtube_cookies.txt"
probe_url = "https://www.youtube.com/watch?v=jNQXAC9IVRw"
max_pixels = 2073600
max_fps = 60.0
# 超过该时长的视频直接跳过，不入队（主要针对 1–4 小时的直播回放）。0 = 不限制。
max_duration_seconds = 7200

[bilibili]
biliup = "/usr/local/bin/biliup"
cookies = "/var/lib/y2b/bilibili_cookies.json"
# 新投稿之间至少间隔 30 分钟；B站返回 21566 后全局冷却 6 小时。
submit_interval_seconds = 1800
rate_limit_cooldown_seconds = 21600

[ai]
pi = "/usr/local/bin/pi"
extension = "/opt/y2b/pi/y2b-extension.ts"
policy = "/opt/y2b/pi/policy.json"
provider = "deepseek"
model = "deepseek-v4-flash"
translation_model = "deepseek-v4-pro"
# 投稿元数据、分句和翻译统一关闭 thinking，避免成本和流式输出量失控。
thinking = "off"
# 单次 Pi 调用超时。长视频翻译批次偶发超过 5 分钟，默认 15 分钟。
timeout_seconds = 900
# adaptive: 分句按 token 自适应；翻译同时按 token 和条数上限拆批。
# whole_video: 只允许整条视频一次处理，超过安全阈值则停止并提示切换模式。
batch_mode = "adaptive"
context_window_tokens = 256000
safe_context_tokens = 200000
segment_overlap_cues = 12
# 单次分句调用的最大 cue 数，防止超大调用超时/失败重来代价大。
segment_max_cues = 400
# 每批 cue 数。40 比 25 少约 40% 调用，固定 prompt 开销跟着摊薄；翻译走 v4-pro，对齐比小批次更稳。
translation_batch_cues = 40
# Pi 翻译批次并发。2 GiB 服务器实测 3 路仅约 320–380 MiB，默认提高到 4；继续受 systemd 内存上限保护。
translation_concurrency = 4
# 单批输出不是有效 JSON、索引校验失败或 Pi 调用失败时的额外重试次数。
translation_batch_retries = 2
# daily_token_limit = 1000000

[render]
ffmpeg = "/usr/local/bin/ffmpeg"
ffprobe = "/usr/local/bin/ffprobe"

[storage]
warn_free_gib = 10
stop_free_gib = 5
delete_large_after_upload = true
daily_backups = 7
weekly_backups = 4

[translation]
source_lang = "en"
target_lang = "zh-CN"
# defaultAudioLanguage 已知且不匹配时默认只告警并标记，不硬拦截。
enforce_source_lang = false

[websub]
# 默认关闭；只有准备好公网 HTTPS 回调入口后才能开启。
enabled = false
bind_addr = "127.0.0.1:8787"
callback_base_url = ""
# 推送启用后，Data API 只需每 30 分钟兜底轮询一次。
data_api_poll_minutes = 30
