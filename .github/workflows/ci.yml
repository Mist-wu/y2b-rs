name: CI

# PRs only: pushes to main were checked locally by .githooks/pre-push (fmt, Gitleaks and the same commands).
on:
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Rust 与脚本
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: 安装 clippy
        run: |
          rustup default stable
          rustup component add clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - name: Python 测试与 Shell 检查
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m unittest discover -s deploy/tests -p 'test_*.py'
          python3 -m unittest discover -s .github/workflows/tests -p 'test_*.py'
          shellcheck deploy/*.sh
